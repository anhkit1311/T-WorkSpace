services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      WEB_ORIGIN: https://${APP_DOMAIN:?}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      JWT_SECRET: ${JWT_SECRET:?}
      TRUST_PROXY: "true"
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:?}
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 40099
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      SOCKET_ADAPTER: ${SOCKET_ADAPTER:-local}
      SOCKET_CHANNEL_PREFIX: ${SOCKET_CHANNEL_PREFIX:-collabspace}
      API_INSTANCE_ID: ${API_INSTANCE_ID:-}
      SFU_PUBLIC_URL: ${SFU_PUBLIC_URL:-}
      MEDIASOUP_WORKERS: ${MEDIASOUP_WORKERS:-2}
      MEETING_MAX_USERS: ${MEETING_MAX_USERS:-20}
      MEETING_MAX_TABS_PER_USER: ${MEETING_MAX_TABS_PER_USER:-2}
      MEETING_MAX_SOURCES_PER_PEER: ${MEETING_MAX_SOURCES_PER_PEER:-3}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      REQUEST_LOGS: ${REQUEST_LOGS:-true}
      OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:-}
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER:-db}
      WORKSPACE_FILE_QUOTA_BYTES: ${WORKSPACE_FILE_QUOTA_BYTES:-536870912}
      USER_FILE_QUOTA_BYTES: ${USER_FILE_QUOTA_BYTES:-134217728}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Recordings and lesson videos (HLS) on a volume; FFmpeg is in the image.
      FFMPEG_COMMAND: ffmpeg
      MEDIA_DIR: /app/data/media
      # Call center: ARI over the Docker network, browsers reach SIP over WSS through Nginx.
      ASTERISK_ARI_URL: http://asterisk:8088
      ASTERISK_ARI_USER: nexo
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:?}
      VITE_SIP_WS_URL: wss://${APP_DOMAIN:?}/ws
    volumes:
      - media_prod:/app/data/media
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "40000-40099:40000-40099/udp"
      - "40000-40099:40000-40099/tcp"

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_SFU_URL: ${VITE_SFU_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      asterisk:
        condition: service_started
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      NGINX_ENVSUBST_FILTER: ^APP_DOMAIN$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${TLS_CERTS_DIR:?}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT_DIR:?}:/var/www/certbot:ro

  # PBX of the call center. 8088 (ARI, SIP over WebSocket) stays inside the Docker network;
  # Nginx proxies wss://APP_DOMAIN/ws to it. 5060/udp serves desk SIP phones on the campus LAN
  # (acl.conf); there is no SIP trunk, calls stay inside TDTU.
  asterisk:
    build: ./asterisk
    restart: unless-stopped
    hostname: pbx.tdtu.local
    environment:
      ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:?}
      SPIKE_SIP_PASSWORD: ${ASTERISK_SPIKE_SIP_PASSWORD:?}
      EXTERNAL_IP: ${ASTERISK_EXTERNAL_IP:?}
      ARI_ALLOWED_ORIGINS: https://${APP_DOMAIN:?}
    volumes:
      - ./asterisk/config:/opt/nexo-asterisk:ro
      - ${ASTERISK_LOG_DIR:-./asterisk/logs}:/var/log/asterisk
    ports:
      - "5060:5060/udp"
      - "10000-10099:10000-10099/udp"

  # STUN/TURN for clients behind symmetric NAT or networks that block UDP (e.g. some 4G
  # carriers). Host networking so the relay ports are exposed on the public IP directly.
  # The API issues time-limited credentials with the same TURN_SHARED_SECRET.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    profiles: ["turn"]
    # Let's Encrypt private keys are readable by root only (needed for TURNS on 5349).
    user: "0:0"
    volumes:
      - ${TLS_CERTS_DIR:?}:/etc/letsencrypt:ro
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49160
      - --max-port=49999
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?}
      - --realm=${APP_DOMAIN:?}
      - --cert=/etc/letsencrypt/live/${APP_DOMAIN:?}/fullchain.pem
      - --pkey=/etc/letsencrypt/live/${APP_DOMAIN:?}/privkey.pem
      - --fingerprint
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      # behind 1:1 NAT (AWS, GCP...): TURN_EXTERNAL_IP_ARG=--external-ip=<public>/<private>
      - ${TURN_EXTERNAL_IP_ARG:---no-software-attribute}

volumes:
  postgres_prod:
  media_prod:
