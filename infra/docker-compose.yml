services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: realtime_workspace
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
    ports:
      - "5432:5432"
    volumes:
      - ../postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d realtime_workspace"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
