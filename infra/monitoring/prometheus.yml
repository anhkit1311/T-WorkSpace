# Q5: Prometheus scrapes the API's /metrics (bearer token = OPERATIONS_TOKEN, kept in a file).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nexo-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/operations_token
    # Dev: the API runs on the host. Production (docker-compose.prod.yml): use api:3001, and list
    # every API instance here; nexo_acd_leader tells which one runs the ACD.
    static_configs:
      - targets: ["host.docker.internal:3001"]
