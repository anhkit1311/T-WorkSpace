; HTTP server: ARI (REST + events WebSocket) and SIP over WebSocket at /ws.
; Plain HTTP inside the Docker network; in production only Nginx (TLS) is exposed to browsers,
; and ARI stays reachable from the API container only.
[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
; Default is 100 and is shared by ARI (ACD) and SIP-over-WS clients; the ACD load test hit it at 100 calls.
sessionlimit = 500
