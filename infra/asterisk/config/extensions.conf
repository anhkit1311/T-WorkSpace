; Dialplan. Asterisk only moves media; routing decisions for the hotline (IVR, queues, ACD) are made
; by the nexo ARI application in the API, so they are tested and reported like the rest of the app.

[general]
static = yes
writeprotect = yes

[globals]
; CC-12 channel limits (toll-fraud and overload guards).
OUTBOUND_MAX = 4          ; simultaneous outside calls through the trunk
OUTBOUND_PER_EXTENSION = 1 ; an extension places one outside call at a time
OUTBOUND_MAX_SECONDS = 1800 ; BR-21: an outside call is cut after 30 minutes of talk
INBOUND_MAX = 30          ; simultaneous hotline calls accepted from the trunk

[from-internal]
; Internal calls between extensions (4 digits; department ranges such as 1100-1199).
; NV-CC5: no answer, busy or not registered goes to that extension's voicemail (ARI app); a caller
; who hangs up first (CANCEL) or a finished conversation (ANSWER) does not.
exten => _1XXX,1,NoOp(Internal ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},25)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER" | "${DIALSTATUS}" = "CANCEL"]?done)
 same => n,Stasis(nexo,voicemail,${EXTEN},${DIALSTATUS})
 same => n(done),Hangup()

; 8000: echo test, checks the audio path both ways.
exten => 8000,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; BR-20: outside numbers need the trunk permission; extensions without it land here (see
; from-internal-out for the ones that have it).
exten => _0[1-9]XXXXXXXX,1,Goto(denied,${EXTEN},1)
exten => _0[1-9]XXXXXXXXX,1,Goto(denied,${EXTEN},1)

; CC-12: international (00…, +…) and premium-looking numbers are refused and logged.
exten => _00.,1,Goto(blocked,${EXTEN},1)
exten => _+.,1,Goto(blocked,${EXTEN},1)

; 9000: hands the call to the ARI application (week-1 spike for the ACD).
exten => 9000,1,NoOp(ARI spike from ${CALLERID(num)})
 same => n,Stasis(nexo,internal-test)
 same => n,Hangup()

; 7000: meeting dial-in (M1). The ARI app asks for the room's 6-digit code and joins the caller
; to the video meeting as an audio participant.
exten => 7000,1,NoOp(Meeting dial-in from ${CALLERID(num)})
 same => n,Stasis(nexo,meeting)
 same => n,Hangup()

[from-internal-out]
; Extensions allowed to call out (agents, and others the admin granted; BR-20). Call-back to an
; outside number (ticket "Gọi lại", CC-8) goes through the SIP trunk; needs pjsip_trunk.conf from the
; provider (CC-4), otherwise Dial fails and the caller hears congestion.
; CC-12: only Vietnamese national numbers (10-11 digits starting 0[1-9]).
exten => _0[1-9]XXXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _0[1-9]XXXXXXXXX,1,Goto(outbound,${EXTEN},1)
include => from-internal

[from-web]
; "Liên hệ phòng ban": a temporary browser endpoint reaches only the department queue it was made
; for; the ARI app looks the session up by endpoint name.
exten => hotline,1,NoOp(Web call from ${CHANNEL(endpoint)})
 same => n,Stasis(nexo,web,${CHANNEL(endpoint)})
 same => n,Hangup()

[denied]
exten => _X.,1,Log(NOTICE,BR-20 ${CALLERID(num)} has no permission to call ${EXTEN})
 same => n,Congestion(5)
 same => n,Hangup()

[outbound]
exten => _X.,1,NoOp(Outbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(GROUP(outbound-ext)=${CALLERID(num)})
 same => n,GotoIf($[${GROUP_COUNT(${CALLERID(num)}@outbound-ext)} > ${OUTBOUND_PER_EXTENSION}]?limit)
 same => n,Set(GROUP()=outbound)
 same => n,GotoIf($[${GROUP_COUNT(outbound)} > ${OUTBOUND_MAX}]?limit)
 same => n,Dial(PJSIP/${EXTEN}@trunk,60,S(${OUTBOUND_MAX_SECONDS}))
 same => n,Congestion(5)
 same => n,Hangup()
 same => n(limit),Log(WARNING,CC-12 outbound limit reached by ${CALLERID(num)} -> ${EXTEN})
 same => n,Congestion(5)
 same => n,Hangup()

[blocked]
exten => _X.,1,Log(WARNING,CC-12 blocked international call ${CALLERID(num)} -> ${EXTEN})
 same => n,Congestion(5)
 same => n,Hangup()
exten => _+.,1,Goto(blocked,0${EXTEN:1},1)

[from-trunk]
; Calls to the hotline number arrive here from the SIP trunk; the ARI app runs IVR and ACD.
exten => _X.,1,NoOp(Hotline ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(GROUP()=inbound)
 same => n,GotoIf($[${GROUP_COUNT(inbound)} > ${INBOUND_MAX}]?full)
 same => n,Stasis(nexo,inbound,${EXTEN})
 same => n,Hangup()
 same => n(full),Log(WARNING,CC-12 inbound limit reached - rejecting ${CALLERID(num)})
 same => n,Busy(5)
 same => n,Hangup()
