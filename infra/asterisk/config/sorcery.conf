; PJSIP objects come from pjsip.conf (static: transports, spike, trunk) and from memory, which the
; API fills over ARI (PUT /ari/asterisk/config/dynamic/res_pjsip/...) for extensions created on the
; web (CC-2). Memory is lost on restart, so the API re-pushes every active extension on connect.
[res_pjsip]
endpoint = config,pjsip.conf,criteria=type=endpoint
endpoint = memory
auth = config,pjsip.conf,criteria=type=auth
auth = memory
aor = config,pjsip.conf,criteria=type=aor
aor = memory
