; PJSIP for the TDTU call center. Every phone is a standard SIP extension:
; browsers (JsSIP) over WebSocket with DTLS-SRTP, softphones/IP phones over UDP.
; The entrypoint appends external addresses to transport-udp and writes pjsip_spike.conf.

[global]
type = global
user_agent = TDTU Call Center
; No "anonymous" identifier: a request that matches no endpoint is rejected (CC-12).
endpoint_identifier_order = ip,username
; Report repeated requests from unknown endpoints as security events (read by fail2ban).
unidentified_request_count = 5
unidentified_request_period = 5
unidentified_request_prune_interval = 30

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; SIP over WebSocket rides on the HTTP server in http.conf (ws://host:8088/ws).
; In production Nginx terminates TLS and browsers connect with wss://.
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

; ---- templates -------------------------------------------------------------------------------

[endpoint-base](!)
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw
direct_media = no
; CC-12: extensions may only reach the dialplan of from-internal; no anonymous calls.
allow_unauthenticated_options = no

[webrtc-endpoint](!,endpoint-base)
transport = transport-ws
; webrtc=yes turns on AVPF, DTLS-SRTP with an auto-generated certificate, ICE and rtcp-mux.
webrtc = yes

[sip-endpoint](!,endpoint-base)
transport = transport-udp
; CC-12: UDP softphones only from private networks (acl.conf).
acl = internal-only
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[auth-userpass](!)
type = auth
auth_type = userpass

[aor-single](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

#include pjsip_spike.conf
; No SIP trunk: the call center is internal to TDTU (no calls to or from the public network).
