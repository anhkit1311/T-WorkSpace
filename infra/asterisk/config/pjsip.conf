; PJSIP for the TDTU call center. Every phone is a standard SIP extension:
; browsers (JsSIP) over WebSocket with DTLS-SRTP, softphones/IP phones over UDP.
; The entrypoint appends external addresses to transport-udp and writes pjsip_spike.conf.

[global]
type = global
user_agent = TDTU Call Center
endpoint_identifier_order = ip,username,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; SIP over WebSocket rides on the HTTP server in http.conf (ws://host:8088/ws).
; In production Nginx terminates TLS and browsers connect with wss://.
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

; ---- templates -------------------------------------------------------------------------------

[endpoint-base](!)
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw
direct_media = no
; CC-12: extensions may only reach the dialplan of from-internal; no anonymous calls.
allow_unauthenticated_options = no

[webrtc-endpoint](!,endpoint-base)
transport = transport-ws
; webrtc=yes turns on AVPF, DTLS-SRTP with an auto-generated certificate, ICE and rtcp-mux.
webrtc = yes

[sip-endpoint](!,endpoint-base)
transport = transport-udp
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[auth-userpass](!)
type = auth
auth_type = userpass

[aor-single](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

#include pjsip_spike.conf
; SIP trunk for the hotline number (CC-4). Not in git: credentials come from the provider.
#tryinclude pjsip_trunk.conf
