<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thử softphone JsSIP</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 560px; margin: 32px auto; padding: 0 16px; }
      fieldset { display: grid; gap: 10px; border: 1px solid #8884; border-radius: 12px; padding: 16px; }
      label { display: grid; gap: 4px; font-size: 13px; }
      input { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #8886; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #8886; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { font-weight: 600; margin: 16px 0 8px; }
      #log { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; background: #8881; border-radius: 8px; padding: 10px; min-height: 120px; }
    </style>
  </head>
  <body>
    <h1>Thử softphone JsSIP</h1>
    <p>Trang dev cho spike tuần 1: máy lẻ 1101 trên trình duyệt gọi sang Zoiper (1001/1002), echo 8000 hoặc ARI 9000.</p>
    <form id="register">
      <fieldset>
        <label>WebSocket SIP <input id="ws" required /></label>
        <label>Máy lẻ <input id="ext" value="1101" required pattern="[0-9]{3,6}" /></label>
        <label>Mật khẩu <input id="password" type="password" required autocomplete="off" /></label>
      </fieldset>
      <div class="row">
        <button type="submit" id="connect">Đăng ký</button>
        <button type="button" id="disconnect" disabled>Hủy đăng ký</button>
      </div>
    </form>
    <form id="dial">
      <div class="row">
        <input id="target" value="8000" aria-label="Số cần gọi" required pattern="[0-9]{3,15}" />
        <button type="submit" id="call" disabled>Gọi</button>
        <button type="button" id="answer" disabled>Nghe</button>
        <button type="button" id="hangup" disabled>Gác máy</button>
      </div>
    </form>
    <p id="status" role="status">Chưa đăng ký</p>
    <div id="log" aria-live="polite"></div>
    <audio id="remote" autoplay></audio>
    <script type="module" src="/src/dev/softphone-test.ts"></script>
  </body>
</html>
