<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8eef6" />
    <meta
      name="description"
      content="T-WorkSpace · Hệ thống không gian làm việc số tích hợp tổng đài VoIP, họp trực tuyến WebRTC SFU và đào tạo trực tuyến."
    />
    <title>T-WorkSpace · Không gian làm việc số</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Signed-in screens only (the public pages are designed light): the saved choice, else the OS setting.
      // Runs before the first paint so a dark session does not flash white.
      try {
        if (location.pathname.startsWith("/app/")) {
          var theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
