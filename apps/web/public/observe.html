<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observe — See the shape of the noise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

    :root {
      --bg: #000000;
      --fg: #ffffff;
    }

    .font-serif-instrument {
      font-family: 'Instrument Serif', Georgia, serif;
    }

    .liquid-glass {
      background: rgba(0, 0, 0, 0.10);
      background-blend-mode: luminosity;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.15) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.15) 80%,
        rgba(255, 255, 255, 0.45) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass-circle {
      background-blend-mode: luminosity;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass-circle::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.22) 30%,
        rgba(255, 255, 255, 0.16) 50%,
        rgba(255, 255, 255, 0.22) 70%,
        rgba(255, 255, 255, 0.45) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-black text-white m-0 p-0 overflow-hidden">
  <div class="bg-black text-white min-h-screen selection:bg-white selection:text-black overflow-hidden relative">
    <section class="min-h-screen relative overflow-hidden flex flex-col">
      <!-- Background Video -->
      <video id="hero-video" class="absolute inset-0 w-full h-full object-cover object-bottom"
             muted autoplay loop playsinline preload="auto"></video>

      <!-- Navbar -->
      <nav class="relative z-20 px-6 py-6">
        <div class="liquid-glass rounded-full max-w-5xl mx-auto pl-6 pr-1.5 py-1.5 flex items-center justify-between">
          <!-- Left group -->
          <div class="flex items-center gap-2">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-6 h-6">
              <path d="M4.21 16.5 A9 9 0 0 1 16.5 4.21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M16.5 4.21 A9 9 0 0 1 19.79 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.4 2.3"/>
              <path d="M19.79 16.5 A9 9 0 0 1 4.21 16.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.01 4.7"/>
              <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
            </svg>
            <span class="font-semibold text-lg tracking-tight">Observe</span>
            <div class="hidden md:flex gap-8 ml-8">
              <a href="#" class="text-white/80 hover:text-white text-sm font-medium transition-colors">Product</a>
              <a href="#" class="text-white/80 hover:text-white text-sm font-medium transition-colors">Pricing</a>
              <a href="#" class="text-white/80 hover:text-white text-sm font-medium transition-colors">Contact us</a>
            </div>
          </div>

          <!-- Right group -->
          <div class="flex items-center gap-4">
            <button class="text-white text-sm font-medium">Sign Up</button>
            <button class="bg-white rounded-full px-5 py-2 text-black text-sm font-medium whitespace-nowrap">Join Waitlist</button>
          </div>
        </div>
      </nav>

      <!-- Hero Content -->
      <div class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[20%]">
        <h1 class="text-6xl md:text-7xl lg:text-8xl font-serif-instrument tracking-tight whitespace-nowrap mb-4"
            style="text-shadow: 0 0 72px rgba(0, 0, 0, 0.42), 0 4px 28px rgba(0, 0, 0, 0.28);">
          See the shape of the <em class="italic">noise</em>
        </h1>
        <p class="text-white/70 text-sm leading-relaxed max-w-2xl md:whitespace-nowrap mb-10"
           style="text-shadow: 0 0 30px rgba(0, 0, 0, 0.32), 0 1px 10px rgba(0, 0, 0, 0.20);">
          Every event from your product — rendered as one picture you can actually read.
        </p>
        <div class="max-w-xl w-full">
          <div class="liquid-glass rounded-full pl-6 pr-1.5 py-1.5 flex items-center gap-3">
            <input type="email" placeholder="Enter your email"
                   class="bg-transparent border-none outline-none flex-1 text-white placeholder:text-white/90 text-sm">
            <button class="bg-white rounded-full px-6 py-3 text-black text-sm font-medium whitespace-nowrap hover:scale-105 transition-transform duration-300">
              Join Waitlist
            </button>
          </div>
        </div>
      </div>

      <!-- Social Row -->
      <div class="relative z-10 flex justify-center gap-4 pb-12">
        <button class="liquid-glass-circle w-14 h-14 flex items-center justify-center rounded-full text-white/80 hover:text-white hover:bg-white/5 transition-all">
          <iconify-icon icon="lucide:instagram" class="text-xl"></iconify-icon>
        </button>
        <button class="liquid-glass-circle w-14 h-14 flex items-center justify-center rounded-full text-white/80 hover:text-white hover:bg-white/5 transition-all">
          <iconify-icon icon="lucide:twitter" class="text-xl"></iconify-icon>
        </button>
        <button class="liquid-glass-circle w-14 h-14 flex items-center justify-center rounded-full text-white/80 hover:text-white hover:bg-white/5 transition-all">
          <iconify-icon icon="lucide:globe" class="text-xl"></iconify-icon>
        </button>
      </div>
    </section>
  </div>

  <script>
    const video = document.getElementById('hero-video');
    video.src = "https://designerstephen.github.io/public-assets/videos/observe-hero.mp4";
    video.playbackRate = 0.5;
  </script>
</body>
</html>
