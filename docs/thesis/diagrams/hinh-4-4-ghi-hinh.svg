<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="Arial, 'Segoe UI', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="10" y="20" width="250" height="122" rx="6" fill="#fff6e0" stroke="#a06a00" stroke-width="1.5" /><text x="135" text-anchor="middle" font-size="13" fill="#111"  ><tspan x="135" y="60.589999999999996">Chọn luồng cần ghi</tspan><tspan x="135" y="77.23">mọi micro + một hình:</tspan><tspan x="135" y="93.86999999999999">màn hình chia sẻ &gt;</tspan><tspan x="135" y="110.51">người nói chính &gt; camera</tspan></text><rect x="285" y="20" width="250" height="122" rx="6" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5" /><text x="410" text-anchor="middle" font-size="13" fill="#111"  ><tspan x="410" y="60.589999999999996">PlainTransport + Consumer</tspan><tspan x="410" y="77.23">mỗi luồng → một cổng UDP;</tspan><tspan x="410" y="93.86999999999999">FFmpeg chỉ sao chép gói</tspan><tspan x="410" y="110.51">(-c copy), không giải mã</tspan></text><rect x="560" y="20" width="250" height="122" rx="6" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5" /><text x="685" text-anchor="middle" font-size="13" fill="#111"  ><tspan x="685" y="60.589999999999996">Phần ghi (.mkv)</tspan><tspan x="685" y="77.23">đổi tập luồng và giữ ≥ 4 s</tspan><tspan x="685" y="93.86999999999999">→ bắt đầu phần mới;</tspan><tspan x="685" y="110.51">manifest lưu mốc bắt đầu</tspan></text><path d="M260,81 L285,81" fill="none" stroke="#333" stroke-width="1.5"  marker-end="url(#ah)" /><path d="M535,81 L560,81" fill="none" stroke="#333" stroke-width="1.5"  marker-end="url(#ah)" /><rect x="560" y="238" width="250" height="100" rx="6" fill="#fdf2e9" stroke="#b5702d" stroke-width="1.5" /><text x="685" text-anchor="middle" font-size="13" fill="#111"  ><tspan x="685" y="275.91">Hậu xử lý khi kết thúc</tspan><tspan x="685" y="292.55">cắt, nối các phần → HLS</tspan><tspan x="685" y="309.19">(media_jobs, thử lại 3 lần)</tspan></text><rect x="285" y="238" width="250" height="100" rx="6" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5" /><text x="410" text-anchor="middle" font-size="13" fill="#111"  ><tspan x="410" y="267.59000000000003">Chép lời (tùy chọn)</tspan><tspan x="410" y="284.23">tách âm thanh 16 kHz mono</tspan><tspan x="410" y="300.87000000000006">→ Whisper → captions.vtt,</tspan><tspan x="410" y="317.51000000000005">transcript.json</tspan></text><rect x="10" y="238" width="250" height="100" rx="6" fill="#e6edf7" stroke="#2b4c7e" stroke-width="1.5" /><text x="135" text-anchor="middle" font-size="13" fill="#111"  ><tspan x="135" y="275.91">Phát lại và chia sẻ</tspan><tspan x="135" y="292.55">HLS + phụ đề, gắn vào</tspan><tspan x="135" y="309.19">biên bản của phiên họp</tspan></text><path d="M685,142 L685,238" fill="none" stroke="#333" stroke-width="1.5"  marker-end="url(#ah)" /><path d="M560,288 L535,288" fill="none" stroke="#333" stroke-width="1.5"  marker-end="url(#ah)" /><path d="M285,288 L260,288" fill="none" stroke="#333" stroke-width="1.5"  marker-end="url(#ah)" /></svg>