.5" y="479.375">tách âm thanh</tspan></text><rect x="585" y="520" width="235" height="60" rx="6" fill="#f1f1f1" stroke="#666" stroke-width="1.5" /><text x="702.5" text-anchor="middle" font-size="12.5" fill="#111"  ><tspan x="702.5" y="546.375">coturn (TURN)</tspan><tspan x="702.5" y="562.375">cho mạng chặn UDP</tspan></text><rect x="10" y="665" width="820" height="170" rx="8" fill="#fafafa" stroke="#777" stroke-width="1.3" stroke-dasharray="7 4"/><text x="22" text-anchor="start" font-size="13.5" fill="#333" font-weight="700" ><tspan x="22" y="686.725"></tspan></text><text x="818" text-anchor="end" font-size="13.5" fill="#333" font-weight="700" ><tspan x="818" y="687.725">Tầng dữ liệu và dịch vụ phụ trợ</tspan></text><rect x="20" y="715" width="193" height="100" rx="6" fill="#fdf2e9" stroke="#b5702d" stroke-width="1.5" /><text x="116.5" text-anchor="middle" font-size="12.5" fill="#111"  ><tspan x="116.5" y="753.375">PostgreSQL 17</tspan><tspan x="116.5" y="769.375">40 migration, LISTEN/</tspan><tspan x="116.5" y="785.375">NOTIFY, advisory lock</tspan></text><rect x="223" y="715" width="193" height="100" rx="6" fill="#fdf2e9" stroke="#b5702d" stroke-width="1.5" /><text x="319.5" text-anchor="middle" font-size="12.5" fill="#111"  ><tspan x="319.5" y="753.375">Kho tệp</tspan><tspan x="319.5" y="769.375">đĩa hoặc S3/MinIO</tspan><tspan x="319.5" y="785.375">(đính kèm, HLS, bản ghi)</tspan></text><rect x="426" y="715" width="193" height="100" rx="6" fill="#fdf2e9" stroke="#b5702d" stroke-width="1.5" /><text x="522.5" text-anchor="middle" font-size="12.5" fill="#111"  ><tspan x="522.5" y="753.375">Dịch vụ chép lời</tspan><tspan x="522.5" y="769.375">Whisper / faster-whisper</tspan><tspan x="522.5" y="785.375">(API tương thích OpenAI)</tspan></text><rect x="629" y="715" width="193" height="100" rx="6" fill="#fdf2e9" stroke="#b5702d" stroke-width="1.5" /><text x="725.5" text-anchor="middle" font-size="12.5" fill="#111"  ><tspan x="725.5" y="753.375">Prometheus + Grafana</tsp