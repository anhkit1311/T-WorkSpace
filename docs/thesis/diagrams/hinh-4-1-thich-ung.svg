<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600" font-family="Arial, 'Segoe UI', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="40" y="20" width="270" height="70" rx="6" fill="#e6f4ea" stroke="#2d7a46" stroke-width="1.5" /><text x="175" text-anchor="middle" font-size="14" fill="#111"  ><tspan x="175" y="50.94">cap = 2</tspan><tspan x="175" y="68.86">lớp cao (tối đa)</tspan></text><rect x="40" y="150" width="270" height="70" rx="6" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.5" /><text x="175" text-anchor="middle" font-size="14" fill="#111"  ><tspan x="175" y="180.94">cap = 1</tspan><tspan x="175" y="198.85999999999999">lớp vừa</tspan></text><rect x="40" y="280" width="270" height="70" rx="6" fill="#fff6e0" stroke="#a06a00" stroke-width="1.5" /><text x="175" text-anchor="middle" font-size="14" fill="#111"  ><tspan x="175" y="310.94">cap = 0</tspan><tspan x="175" y="328.86">lớp thấp</tspan></text><rect x="40" y="410" width="270" height="70" rx="6" fill="#fde9e2" stroke="#b5502d" stroke-width="1.5" /><text x="175" text-anchor="middle" font-size="14" fill="#111"  ><tspan x="175" y="440.94">cap = null</tspan><tspan x="175" y="458.86">chỉ âm thanh</tspan></text><path d="M100,90 L100,150" fill="none" stroke="#333" stroke-width="1.5"  marker-end="url(#ah)" /><text text-anchor="start" font-size="12.5" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="4"><tspan x="110" y="120">2 mẫu xấu (≈ 5 s)</tspan></text><path d="M100,220 L100,280" fill="none" stroke="#333" stroke-width="1.5"  marker-end="url(#ah)" /><text text-anchor="start" font-size="12.5" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="4"><tspan x="110" y="250">2 mẫu xấu</tspan></text><path d="M100,350 L100,410" fill="none" stroke="#333" stroke-width="1.5"  marker-end="url(#ah)" /><text text-anchor="start" font-size="12.5" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="4"><tspan x="110" y="380">2 mẫu xấu</tspan></text><path d="M250,150 L250,90" fill="none" stroke="#333" stroke-width="1.5"  marker-end="url(#ah)" /><text text-anchor="start" font-size="12.5" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="4"><tspan x="260" y="120">4 mẫu tốt (≈ 10 s)</tspan></text><path d="M250,280 L250,220" fill="none" stroke="#333" stroke-width="1.5"  marker-end="url(#ah)" /><text text-anchor="start" font-size="12.5" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="4"><tspan x="260" y="250">4 mẫu tốt</tspan></text><path d="M250,410 L250,350" fill="none" stroke="#333" stroke-width="1.5"  marker-end="url(#ah)" /><text text-anchor="start" font-size="12.5" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="4"><tspan x="260" y="380">4 mẫu tốt</tspan></text><path d="M310,55 L560,55 L560,445 L310,445" fill="none" stroke="#b5502d" stroke-width="1.5"  marker-end="url(#ah)" /><text text-anchor="start" font-size="12.5" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="4"><tspan x="570" y="220">2 mẫu rất xấu:</tspan><tspan x="570" y="235.625">xuống thẳng</tspan><tspan x="570" y="251.25">cap = null</tspan></text><text x="40" text-anchor="start" font-size="12.5" fill="#111"  ><tspan x="40" y="514.375">Mẫu xấu: mất gói ≥ 5% hoặc RTT ≥ 400 ms.  Mẫu tốt: mất gói &lt; 2% và RTT &lt; 250 ms.</tspan></text><text x="40" text-anchor="start" font-size="12.5" fill="#111"  ><tspan x="40" y="536.375">Mẫu rất xấu: mất gói ≥ 15% hoặc RTT ≥ 1000 ms.  Lấy mẫu ~2,5 s; đổi bậc thì đặt lại bộ đếm.</tspan></text><text x="40" text-anchor="start" font-size="12.5" fill="#111"  ><tspan x="40" y="558.375">Lớp thực tế của ô = min(lớp theo chính sách, cap); cap = null → tạm dừng video.</tspan></text></svg>