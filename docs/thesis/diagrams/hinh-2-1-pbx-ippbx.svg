r="middle" font-size="12" fill="#111"><tspan x="205" y="356.5">Mỗi máy một đường dây; mở rộng phải đi dây,</tspan><tspan x="205" y="371.9">mở cổng; ít dữ liệu thống kê, ghi âm</tspan></text><text text-anchor="middle" font-size="12" fill="#111"><tspan x="630" y="356.5">Chung hạ tầng mạng; chỉ tính cước khi gọi ra</tspan><tspan x="630" y="371.9">ngoài qua SIP trunk; phần mềm ghi CDR, ghi âm</tspan></text></svg>