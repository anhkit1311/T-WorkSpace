<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Arial, 'Segoe UI', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="410" text-anchor="middle" font-size="14.5" fill="#111" font-weight="700" ><tspan x="410" y="27.075">Gộp các khoảng có mặt của một người (nhiều tab, vào lại)</tspan></text><line x1="60" y1="270" x2="760" y2="270" stroke="#333" stroke-width="1.5" /><line x1="60" y1="262" x2="60" y2="278" stroke="#333" stroke-width="1.2" /><text x="60" text-anchor="middle" font-size="12.5" fill="#111"  ><tspan x="60" y="300.375">bắt đầu phiên</tspan></text><line x1="760" y1="262" x2="760" y2="278" stroke="#333" stroke-width="1.2" /><text x="760" text-anchor="middle" font-size="12.5" fill="#111"  ><tspan x="760" y="300.375">kết thúc phiên</tspan></text><rect x="110" y="55" width="250" height="30" rx="3" fill="#dbe6f5" stroke="#2b4c7e" stroke-width="1.5" /><text x="235" text-anchor="middle" font-size="12.5" fill="#111"  ><tspan x="235" y="74.375">kết nối 1 (tab A)</tspan></text><rect x="300" y="95" width="180" height="30" rx="3" fill="#dbe6f5" stroke="#2b4c7e" stroke-width="1.5" /><text x="390" text-anchor="middle" font-size="12.5" fill="#111"  ><tspan x="390" y="114.375">kết nối 2 (tab B, chồng lấn)</tspan></text><rect x="410" y="135" width="270" height="30" rx="3" fill="#dbe6f5" stroke="#2b4c7e" stroke-width="1.5" /><text x="545" text-anchor="middle" font-size="12.5" fill="#111"  ><tspan x="545" y="154.375">kết nối 3 (mất mạng → vào lại)</tspan></text><rect x="110" y="190" width="570" height="30" rx="3" fill="#c7e9d0" stroke="#2b4c7e" stroke-width="1.5" /><text x="395" text-anchor="middle" font-size="12.5" fill="#111"  ><tspan x="395" y="209.375">Hợp các khoảng = thời gian có mặt (phần chồng lấn tính một lần)</tspan></text><text x="410" text-anchor="middle" font-size="12.5" fill="#111"  font-style="italic"><tspan x="410" y="330.375">Có mặt ≥ 70% thời lượng buổi live → được tính điểm danh</tspan></text></svg>